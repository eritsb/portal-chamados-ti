<div class="page">
  <app-page-header
    eyebrow="ACOMPANHAMENTO"
    titulo="Meus chamados"
    subtitulo="Acompanhe o status das solicitações que você abriu para a equipe de TI."
  >
    <a class="btn btn-primary" routerLink="/chamados/novo">
      <mat-icon>add</mat-icon>
      Abrir chamado
    </a>
  </app-page-header>

  @if (erro()) {
    <div class="status-msg error">{{ erro() }}</div>
  }

  @if (carregando()) {
    <div class="card loading"><span class="spinner"></span>Carregando seus chamados...</div>
  } @else {
    <section class="card list-card">
      <header class="list-head">
        <div>
          <span class="eyebrow">HISTÓRICO</span>
          <h2>{{ total() }} chamado(s) aberto(s) por você</h2>
        </div>
      </header>

      <app-ticket-table
        modo="solicitante"
        [chamados]="chamados()"
        mensagemVazia="Você ainda não abriu nenhum chamado."
        vazioLink="/chamados/novo"
        vazioLinkRotulo="Abrir meu primeiro chamado"
      />
    </section>
  }
</div>
