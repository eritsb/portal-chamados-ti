<div class="page">
  <app-page-header
    eyebrow="CENTRAL DE ATENDIMENTO"
    titulo="Chamados de TI"
    subtitulo="Consulte, filtre e acompanhe todas as solicitações registradas na instituição."
  >
    <a class="btn btn-primary" routerLink="/chamados/novo">
      <mat-icon>add</mat-icon>
      Abrir chamado
    </a>
  </app-page-header>

  <app-ticket-filters (filtrar)="aplicarFiltros($event)" (limpar)="limparFiltros()" />

  @if (erro()) {
    <div class="status-msg error">{{ erro() }}</div>
  }

  <section class="card list-card">
    <header class="list-head">
      <div>
        <span class="eyebrow">RESULTADOS</span>
        <h2>{{ total() }} chamado(s) encontrado(s)</h2>
      </div>
      @if (carregando()) {
        <span class="loading-inline"><span class="spinner"></span>Atualizando...</span>
      }
    </header>

    <app-ticket-table
      modo="gestao"
      [chamados]="chamados()"
      [podeExcluir]="podeExcluir()"
      mensagemVazia="Nenhum chamado encontrado com os filtros selecionados."
      (excluir)="excluir($event)"
    />
  </section>
</div>
